name: build-exe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy matplotlib scipy customtkinter pyinstaller
      - run: pyinstaller --onefile --windowed --collect-all customtkinter --name LogisticModel app.py
      - uses: actions/upload-artifact@v4
        with:
          name: LogisticModel
          path: dist/LogisticModel.exe
